function dayPts(dd){return dd.stops.map(s=>places.find(q=>q.n===s.n)).filter(Boolean).map(p=>[p.lon,p.lat]);}
function routes(sel){return {type:'FeatureCollection',features:DAYS.filter(dd=>!sel||dd.k===sel).map(dd=>({type:'Feature',properties:{color:dd.color,w:sel?5:3.5,o:sel?.9:.75},geometry:{type:'LineString',coordinates:dayPts(dd)}}))};}
function buildLegend(){const g=document.getElementById('legend');g.innerHTML='<div style="font-weight:600;cursor:default">일차별 경로</div>'+DAYS.map(dd=>`<div data-k="${dd.k}" class="${day&&day!=='plan'&&day!==dd.k?'dim':''}"><i style="background:${dd.color}"></i>${dd.label} ${dd.date}</div>`).join('');
 g.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{const dd=DAYS.find(x=>x.k===e.dataset.k);day=day===dd.k?null:dd.k;buildDays();draw();buildList();if(!day)map&&map.flyTo({center:[139.75,35.68],zoom:10.5});});}
function draw(){buildLegend();
 if(!ready)return;mks.forEach(m=>m.remove());mks=[];
 const dO=DAYS.find(d=>d.k===day);const src=map.getSource('route');
 if(dO){const pts=[];const seen={};
  dO.stops.forEach((s,i)=>{const p=places.find(q=>q.n===s.n);if(!p)return;pts.push([p.lon,p.lat]);seen[p.n]=(seen[p.n]?seen[p.n]+',':'')+(i+1);});
  src.setData(routes(dO.k));
  Object.entries(seen).forEach(([n,lab])=>{const p=places.find(q=>q.n===n);addMk(p,lab.length>3?lab.split(',')[0]+'…':lab,dO.color);});
  const b=new maplibregl.LngLatBounds();pts.forEach(x=>b.extend(x));map.fitBounds(b,{padding:50,maxZoom:15});return;}
 src.setData(routes(null));
 places.filter(p=>on.has(p.c)).forEach(p=>{markers[p.i]=addMk(p);});
}
function focus(p){if(!map)return;map.flyTo({center:[p.lon,p.lat],zoom:16});const m=markers[p.i];if(m&&!m.getPopup().isOpen())m.togglePopup();if(innerWidth<760)scrollTo({top:0,behavior:'smooth'});}
function buildDays(){const D=document.getElementById('days');D.innerHTML='';
 [{k:null,label:'전체 장소'},{k:'plan',label:'📋 전체 일정표'},...DAYS].forEach(d=>{const b=document.createElement('button');
  b.textContent=d.date?`${d.label} ${d.date}`:d.label;if(day===d.k)b.classList.add('on');if(d.color){b.classList.add('dc');b.style.setProperty('--dc',d.color);}
  b.onclick=()=>{day=d.k;buildDays();draw();buildList();if(!d.color)map&&map.flyTo({center:[139.75,35.68],zoom:10.5});};D.appendChild(b);});}
function buildCats(){const C=document.getElementById('cats');C.innerHTML='';
 Object.entries(CAT).forEach(([k,[lab,col]])=>{const b=document.createElement('button');if(!on.has(k))b.classList.add('off');
  b.innerHTML=`<span style="width:10px;height:10px;border-radius:50%;background:${col}"></span>${lab} ${places.filter(p=>p.c===k).length}`;
  b.onclick=()=>{on.has(k)?on.delete(k):on.add(k);buildCats();draw();buildList();};C.appendChild(b);});}
function stepHTML(dd,s,i){const p=places.find(q=>q.n===s.n);return `<div class="item" data-i="${p?p.i:''}"><span class="dot" style="background:${dd.color}">${i+1}</span><div><div class="nm">${s.t?`<span style="color:${dd.color}">${esc(s.t)}</span> `:''}${esc(s.n)}</div><div class="nt">${esc(s.tip)}</div>${s.link?`<a href="${s.link}" target="_blank" rel="noopener" style="color:#03a94d;font-weight:600">📎 ${esc(s.linkLabel||'참고 링크')}</a>`:''}</div></div>`;}
function buildList(){const L2=document.getElementById('list');let h='';
 if(day==='plan'||DAYS.find(d=>d.k===day)){(day==='plan'?DAYS:[DAYS.find(d=>d.k===day)]).forEach(dd=>{h+=`<div class="grp" style="color:${dd.color};font-size:14px;font-weight:600">${dd.label} · ${dd.date}<br><span style="font-weight:400;font-size:12.5px">${esc(dd.theme)}</span></div>`;dd.stops.forEach((s,i)=>h+=stepHTML(dd,s,i));});}
 else Object.entries(CAT).forEach(([k,[lab,col]])=>{if(!on.has(k))return;const ps=places.filter(p=>p.c===k);if(k==='food'||k==='vid')ps.sort((a,b)=>(b.r||0)-(a.r||0));
  h+=`<div class="grp">${lab}</div>`;ps.forEach(p=>h+=`<div class="item" data-i="${p.i}"><span class="dot ${p.c}" style="background:${col}">${num(p)}</span><div><div class="nm">${esc(p.n)} ${badge(p)}</div>${p.date?`<div class="nt" style="color:var(--stay);font-weight:500">${esc(p.date)}</div>`:''}<div class="nt">${esc(p.note)}</div><div>${links(p)}</div></div></div>`);});
 L2.innerHTML=h;L2.querySelectorAll('.item').forEach(e=>e.onclick=ev=>{if(ev.target.tagName==='A'||e.dataset.i==='')return;const p=places[+e.dataset.i];if(day&&day!=='plan'){map&&map.flyTo({center:[p.lon,p.lat],zoom:16});}else{if(day==='plan'){day=null;buildDays();draw();}focus(p);}});}
buildDays();buildCats();draw();buildList();
</script>
</body>
</html>
